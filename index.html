<style>
:root{--bg:#f4f7fb;--card:#fff;--tx:#1b2733;--mut:#64748b;--bd:#dbe3ec;--pri:#ff6a13;--ok:#16a34a;--okb:#dcfce7;--no:#dc2626;--nob:#fee2e2}

.wrap{max-width:780px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
select{max-width:100%}
button.pri{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
button:disabled{opacity:.45;cursor:default}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:var(--pri);width:0}
.meta{color:var(--mut);font-size:14px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
.q{font-size:18px;font-weight:600;margin:10px 0 14px}
.opt{display:flex;gap:10px;width:100%;text-align:left;margin-bottom:8px;padding:12px;border-radius:10px}
.opt b{min-width:22px}
.opt.ok{background:var(--okb);border-color:var(--ok)}.opt.no{background:var(--nob);border-color:var(--no)}
.exp{margin-top:10px;padding:12px;border-left:4px solid var(--pri);background:var(--bg);border-radius:6px;display:none}
.tag{padding:2px 8px;border-radius:99px;font-size:12px;background:var(--bd)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.grid button{padding:6px 0;font-size:13px}.grid .c{background:var(--okb);border-color:var(--ok)}.grid .w{background:var(--nob);border-color:var(--no)}.grid .cur{outline:2px solid var(--pri)}
.score{font-size:40px;font-weight:700;text-align:center}
.hide{display:none}
</style></head><body><div class="wrap">

  <div class="row" style="margin-top:14px">

   <button onclick="finish()" style="margin-left:auto">Finish</button>
  </div>
 </div>
 <div class="card"><div class="meta" style="margin-bottom:8px">Jump to question</div><div class="grid" id="grid"></div></div>

h IDMC performance feature is relevant?", "o": ["Push compatible transformation work to the database so processing occurs close to the data", "Move more data into the mapping engine before applying transformations", "Disable database-side execution for joins and aggregations for the stated requirement", "Increase data movement so the Secure Agent performs all operations"], "a": 0, "e": "Pushdown improves performance by executing compatible operations in the database, reducing data movement and engine-side processing.", "m": 1, "id": 92}, {"n": 93, "d": "Easy", "t": "Batch and Real-Time Ingestion", "q": "A nightly file drop can be processed at a fixed time, while fraud events must be handled continuously. Which ingestion design correctly distinguishes the two?", "o": ["Use batch only for continuously arriving low-latency events for the stated requirement", "Use real-time ingestion only for monthly scheduled files within the integration workflow", "Choose batch for scheduled grouped loads and real-time ingestion for continuously arriving data that needs low latency", "Treat batch and real-time as identical execution patterns as the primary design approach"], "a": 2, "e": "Batch ingestion processes data in scheduled groups, while real-time ingestion is appropriate for continuously arriving data requiring low-latency handling.", "m": 1, "id": 93}, {"n": 94, "d": "Easy", "t": "Batch and Real-Time Ingestion", "q": "The business accepts a once-per-day load for one feed but requires immediate processing for another. Which principle should guide the ingestion choice?", "o": ["Choose batch for scheduled grouped loads and real-time ingestion for continuously arriving data that needs low latency", "Use batch only for continuously arriving low-latency events for the stated requirement", "Use real-time ingestion only for monthly scheduled files within the integration workflow", "Treat batch and real-time as identical execution patterns as the primary design approach"], "a": 0, "e l intervention. Which design best matches the IDMC capabilities?", "o": ["Keep CAI and CDI isolated and require manual execution between them", "Use CAI service connectors and integrated invocation to orchestrate external services and CDI processing", "Use mapping transformations as a replacement for service connectors for the stated requirement", "Use monitoring logs as the mechanism for invoking external APIs"], "a": 1, "e": "CAI connectors provide interaction with external services, and CAI-CDI integration supports end-to-end orchestration across application and data integration processes.", "m": 1, "id": 97}, {"n": 98, "d": "Easy", "t": "CAI Connectors and CDI Integration", "q": "A CAI workflow needs reusable connectivity to an external application while coordinating a downstream CDI mapping. Which approach should be used?", "o": ["Use CAI service connectors and integrated invocation to orchestrate external services and CDI processing", "Keep CAI and CDI isolated and require manual execution between them", "Use mapping transformations as a replacement for service connectors for the stated requirement", "Use monitoring logs as the mechanism for invoking external APIs"], "a": 0, "e": "CAI connectors provide interaction with external services, and CAI-CDI integration supports end-to-end orchestration across application and data integration processes.", "m": 1, "id": 98}, {"n": 99, "d": "Easy", "t": "CAI Connectors and CDI Integration", "q": "The organization wants one orchestrated process across application APIs and data integration jobs. Which IDMC design pattern supports this?", "o": ["Use CAI service connectors and integrated invocation to orchestrate external services and CDI processing", "Keep CAI and CDI isolated and require manual execution between them", "Use mapping transformations as a replacement for service connectors for the stated requirement", "Use monitoring logs as the mechanism for invoking external APIs"], "a": 0, "e": "CAI connectors provide interaction with external services, and CAI-CDI integration supports end-to-end orchestration across application and data integration processes.", "m": 1, "id": 99}, {"n": 100, "d": "Easy", "t": "CAI Connectors and CDI Integration", "q": "A business process begins with a service request and must trigger a CDI mapping as part of the same orchestration. Which integration approach is appropriate?", "o": ["Keep CAI and CDI isolated and require manual execution between them", "Use mapping transformations as a replacement for service connectors for the stated requirement", "Use monitoring logs as the mechanism for invoking external APIs", "Use CAI service connectors and integrated invocation to orchestrate external services and CDI processing"], "a": 3, "e": "CAI connectors provide interaction with external services, and CAI-CDI integration supports end-to-end orchestration across application and data integration processes.", "m": 1, "id": 100}, {"n": 101, "d": "Medium", "t": "Data Profiling", "q": "A retail organization is working with IDMC on a data profiling requirement. A new loyalty feed arrives from several stores with different null patterns and inconsistent category codes. The team must design cleansing rules but has no reliable data dictionary. They want evidence about completeness, distinct values, and suspicious patterns before mapping development begins. The team wants a maintainable solution that uses the platform capabilities appropriately. They want to avoid unnecessary manual work and preserve the existing business intent. The architect is reviewing the design before implementation. Based on this scenario, which decision is most appropriate?", "o": ["Begin transformation design immediately using assumed formats for the stated requirement", "Run data profiling first and use the findings to design validation and cleansing logic", "Increase Secure Agent resources before inspecting the dataset within the integration workflow", "Build a taskflow schedule before examining source quality as the primary design approach"], "a": 1, "e": "Profiling provides factual information about the incoming data and reduces the risk of designing rules around incorrect assumptions.", "m": 2, "id": 101}, {"n": 102, "d": "Medium", "t": "Reusable Logic", "q": "A saas organization is working with IDMC on a reusable logic requirement. Multiple client pipelines repeat the same trim, standardization, and validation steps. A rule change currently requires edits in many mappings. The team wants one maintained implementation while preserving client-specific source and target logic. The team wants a maintainable solution that uses the platform capabilities appropriately. They want to avoid unnecessary manual work and preserve the existing business intent. The architect is reviewing the design before implementation. Based on this scenario, which decision is most appropriate?", "o": ["Duplicate the corrected transformations into every mapping", "Create a separate Secure Agent for each client pipeline", "Move the shared transformation sequence into reusable mapplet logic", "Hardcode the common logic in mapping tasks instead"], "a": 2, "e": "Reusable mapplet logic centralizes repeated transformation behavior and improves consistency and maintainability.", "m": 2, "id": 102}, {"n": 103, "d": "Medium", "t": "Joiner and Pushdown", "q": "A logistics organization is working with IDMC on a joiner and pushdown requirement. Shipment and customer datasets are large and currently joined inside the integration engine. Execution time is rising because large row sets move between Snowflake and IDMC. The join is based on simple compatible keys and business logic must remain unchanged. The team wants a maintainable solution that uses the platform capabilities appropriately. They want to avoid unnecessary manual work and preserve the existing business intent. The architect is reviewing the design before implementation. Based on this scenario, which decision is most appropriate?", "o": ["Use a pushdown-compatible join design so the database performs the join", "Keep the join entirely in the mapping engine", "Replace the join with multiple Router groups for the stated requirement", "Increase source extraction volume before joining within the integration workflow"], "a": 0, "e": "A pushdown-compatible join leverages database processing and reduces unnecessary data movement.", "m": 2, "id": 103}, {"n": 104, "d": "Medium", "t": "Aggregator", "q": "A telecom organization is working with IDMC on a aggregator requirement. Daily call records must be summarized to one row per subscriber and date. The existing mapping uses several expressions and duplicated branches to calculate totals. The team needs SUM, COUNT, and AVG metrics with a simpler design. The team wants a maintainable solution that uses the platform capabilities appropriately. They want to avoid unnecessary manual work and preserve the existing business intent. The architect is reviewing the design before implementation. Based on this scenario, which decision is most appropriate?", "o": ["Use a Router transformation with one branch per metric", "Use an Aggregator transformation with subscriber and date group fields", "Use a Lookup transformation to calculate totals for the stated requirement", "Use a Sorter transformation and load all detail rows"], "a": 1, "e": "Aggregator is the mapping component designed for grouped calculations such as SUM, COUNT, and AVG.", "m": 2, "id": 104}, {"n": 105, "d": "Medium", "t": "Router", "q": "A banking organization is working with IDMC on a router requirement. Transactions must follow Deposit, Withdrawal, Transfer, and Review processing paths. The current design uses repeated filters in separate branches. The team wants each row evaluated centrally and the design to remain easy to extend. The team wants a maintainable solution that uses the platform capabilities appropriately. They want to avoid unnecessary manual work and preserve the existing business intent. The architect is reviewing the design before implementation. Based on this scenario, which decision is most appropriate?", "o": ["Use one Aggregator transformation per transaction type", "Use one Router transformation with separate output-group conditions", "Use a Joiner transformation to create branch logic", "Use a Union transformation to test transaction categories"], "a": 1, "e": "Router centralizes condition evaluation and supports multiple named outputs in one transformation.", "m": 2, "id": 105}, {"n": 106, "d": "Medium", "t": "Lookup Cache", "q": "A retail organization is working with IDMC on a lookup cache requirement. Millions of sales rows require product category and brand from a small reference table. The reference data changes rarely, but the current design repeatedly accesses it during processing. The team wants to reduce repeated database calls without changing enrichment logic. The team wants a maintainable solution that uses the platform capabilities appropriately. They want to avoid unnecessary manual work and preserve the existing business intent. The architect is reviewing the design before implementation. Based on this scenario, which decision is most appropriate?", "o": ["Use an appropriately cached lookup for the reference dataset", "Use an uncached lookup for every incoming record", "Replace the lookup with a Rank transformation", "Re-read the reference source separately for every row"], "a": 0, "e": "Caching a small, stable lookup can reduce repeated access and improve enrichment performance.", "m": 2, "id": 106}, {"n": 107, "d": "Medium", "t": "Parameterization", "q": "A insurance organization is working with IDMC on a parameterization requirement. Development, test, and production use different schemas, file paths, and connections. The team currently maintains separate copies of the same mapping for each environment. They want one mapping design that can be promoted safely across environments. The team wants a maintainable solution that uses the platform capabilities appropriately. They want to avoid unnecessary manual work and preserve the existing business intent. The architect is reviewing the design before implementation. Based on this scenario, which decision is most appropriate?", "o": ["Keep separate hardcoded mappings for every environment", "Parameterize the environment-specific values and supply them at runtime", "Embed production values directly in transformation expressions", "Create one Secure Agent per parameter value"], "a": 1, "e": "Parameterization separates environment configuration from transformation logic and reduces duplicated mappings.", "m": 2, "id": 107}, {"n": 108, "d": "Medium", "t": "Taskflow Decision", "q": "A healthcare organization is working with IDMC on a taskflow decision requirement. A pipeline validates incoming claim files before loading production tables. If validation fails, loading must stop and an alert path must run; if it succeeds, loading should continue. The current taskflow executes every step regardless of the validation result. The team wants a maintainable solution that uses the platform capabilities appropriately. They want to avoid unnecessary manual work and preserve the existing business intent. The architect is reviewing the design before implementation. Based on this scenario, which decision is most appropriate?", "o": ["Run all steps sequentially and inspect results later", "Run the load and alert paths in parallel every time", "Add a decision step that branches on the validation outcome", "Use a Sorter transformation to choose the taskflow path"], "a": 2, "e": "A decision step evaluates runtime results and directs orchestration to the correct branch.", "m": 2, "id": 108}, {"n": 109, "d": "Medium", "t": "Parallel Taskflow", "q": "A telecom organization is working with IDMC on a parallel taskflow requirement. Five regional pipelines are independent but run sequentially in one taskflow. The daily processing window is becoming too long as data volume grows. A failure in one region should not delay unrelated regions. The team wants a maintainable solution that uses the platform capabilities appropriately. They want to avoid unnecessary manual work and preserve the existing business intent. The architect is reviewing the design before implementation. Based on this scenario, which decision is most appropriate?", "o": ["Run the independent regional branches in parallel", "Keep all regional tasks strictly sequential", "Combine all regional sources with a Joiner before execution", "Use parameterization as a substitute for parallel orchestration"], "a": 0, "e": "Independent tasks can execute in parallel to reduce total elapsed time without violating dependencies.", "m": 2, "id": 109}, {"n": 110, "d": "Medium", "t": "Fault Handling", "q": "A saas organization is working with IDMC on a fault handling requirement. A CAI workflow invokes an external customer API that occasionally returns temporary errors. At present, one failed call stops the entire process and requires manual restart. The team wants controlled recovery with visibility into failures. The team wants a maintainable solution that uses the platform capabilities appropriately. They want to avoid unnecessary manual work and preserve the existing business intent. The architect is reviewing the design before implementation. Based on this scenario, which decision is most appropriate?", "o": ["Ignore the error and mark the process successful", "Duplicate the entire process for every possible error", "Configure fault handling with an appropriate retry or recovery path", "Use a Union transformation to recover the failed API call"], "a": 2, "e": "Fault handling provides defined recovery behavior and avoids uncontrolled process termination.", "m": 2, "id": 110}, {"n": 111, "d": "Medium", "t": "CDC", "q": "A e-commerce organization is working with IDMC on a cdc requirement. Order statuses change throughout the day, but each integration cycle reloads the complete source table. Most rows are unchanged, and processing time is increasing. The target needs timely inserts, updates, and deletes with lower source impact. The team wants a maintainable solution that uses the platform capabilities appropriately. They want to avoid unnecessary manual work and preserve the existing business intent. The architect is reviewing the design before implementation. Based on this scenario, which decision is most appropriate?", "o": ["Continue full reloads for every cycle for the stated requirement", "Use a Sorter transformation to identify all changes", "Use result caching as the change capture mechanism", "Use incremental change-data processing so only changed rows are handled"], "a": 3, "e": "CDC/incremental processing focuses work on changed records and reduces redundant processing.", "m": 2, "id": 111}, {"n": 112, "d": "Medium", "t": "Batch vs Real-Time", "q": "A payments organization is working with IDMC on a batch vs real-time requirement. Daily settlement files arrive once at midnight, while authorization events arrive continuously. The settlement process can tolerate hours of latency, but authorization events require near- immediate handling. The team wants ingestion modes aligned with business latency. The team wants a maintainable solution that uses the platform capabilities appropriately. They want to avoid unnecessary manual work and preserve the existing business intent. The architect is reviewing the design before implementation. Based on this scenario, which decision is most appropriate?", "o": ["Use real-time ingestion for both workloads regardless of latency", "Use batch ingestion for both workloads to simplify operations", "Use a manual load for events and continuous flow for monthly files", "Use batch ingestion for settlement files and real-time ingestion for authorization events"], "a": 3, "e": "Different latency patterns call for different ingestion modes: scheduled batch for grouped files and real-time for continuously arriving events.", "m": 2, "id": 112}, {"n": 113, "d": "Medium", "t": "Monitoring", "q": "A telecom organization is working with IDMC on a monitoring requirement. Several CDI jobs fail intermittently at different transformations. Engineers spend too much time manually searching individual runs for root causes. They need run status, detailed execution evidence, and trend visibility. The team wants a maintainable solution that uses the platform capabilities appropriately. They want to avoid unnecessary manual work and preserve the existing business intent. The architect is reviewing the design before implementation. Based on this scenario, which decision is most appropriate?", "o": ["Increase warehouse size without reviewing run evidence for the stated requirement", "Create duplicate mappings for failed runs within the integration workflow", "Use IDMC monitoring and execution logs to analyze failures and performance", "Disable error logging to reduce runtime overhead as the primary design approach"], "a": 2, "e": "Monitoring and logs provide the execution evidence needed for diagnosis and trend analysis.", "m": 2, "id": 113}, {"n": 114, "d": "Medium", "t": "CAI Connector", "q": "A travel organization is working with IDMC on a cai connector requirement. A booking workflow must call a partner pricing API and use the response in later process steps. The team currently handles the API interaction outside CAI, which reduces visibility and reuse. They want centrally managed connectivity and error handling. The team wants a maintainable solution that uses the platform capabilities appropriately. They want to avoid unnecessary manual work and preserve the existing business intent. The architect is reviewing the design before implementation. Based on this scenario, which decision is most appropriate?", "o": ["Use a Lookup transformation as the external API client", "Use a CAI service connector within the process", "Run the API manually outside IDMC", "Store the API URL in a mapping expression and call it there"], "a": 1, "e": "Service connectors are designed to integrate CAI processes with external applications and APIs.", "m": 2, "id": 114}, {"n": 115, "d": "Medium", "t": "CAI-CDI", "q": "A fintech organization is working with IDMC on a cai-cdi requirement. An API request received in CAI should validate input and then start a CDI mapping that loads Snowflake. Today an operator starts the mapping manually after the API process finishes. The business wants end-to-end automated execution. The team wants a maintainable solution that uses the platform capabilities appropriately. They want to avoid unnecessary manual work and preserve the existing business intent. The architect is reviewing the design before implementation. Based on this scenario, which decision is most appropriate?", "o": ["Keep CAI and CDI isolated and retain manual handoff", "Replace the CDI mapping with a CAI decision step", "Invoke the CDI process from the CAI orchestration using the supported integration capability", "Use monitoring logs to trigger the mapping manually for the stated requirement"], "a": 2, "e": "CAI-CDI integration supports automated orchestration across application and data integration workloads.", "m": 2, "id": 115}, {"n": 116, "d": "Medium", "t": "Hierarchical Data", "q": "A media organization is working with IDMC on a hierarchical data requirement. Incoming JSON contains nested arrays of sessions, devices, and events. Analysts need relational fields in Snowflake while preserving parent-child relationships. Raw JSON storage alone makes downstream analysis difficult. The team wants a maintainable solution that uses the platform capabilities appropriately. They want to avoid unnecessary manual work and preserve the existing business intent. The architect is reviewing the design before implementation. Based on this scenario, which decision is most appropriate?", "o": ["Discard nested elements and keep only top-level fields", "Flatten the hierarchical structures into an analysis-friendly relational shape while preserving relationships", "Treat each nested array as an unrelated file", "Use a Sorter transformation to convert hierarchy into rows"], "a": 1, "e": "Hierarchical processing/flattening converts nested structures into usable relational forms while retaining relationships.", "m": 2, "id": 116}, {"n": 117, "d": "Medium", "t": "Secure Agent", "q": "A manufacturing organization is working with IDMC on a secure agent requirement. A factory database is accessible only inside the corporate network. Cloud design assets are available, but jobs cannot directly reach the database. The team needs secure runtime connectivity without exposing the database publicly. The team wants a maintainable solution that uses the platform capabilities appropriately. They want to avoid unnecessary manual work and preserve the existing business intent. The architect is reviewing the design before implementation. Based on this scenario, which decision is most appropriate?", "o": ["Expose the database publicly and avoid a runtime agent", "Use a dashboard to connect to the on-premises database", "Use a mapplet as the network runtime component", "Use a Secure Agent in the appropriate runtime environment"], "a": 3, "e": "The Secure Agent executes jobs and provides connectivity between IDMC and protected systems.", "m": 2, "id": 117}, {"n": 118, "d": "Medium", "t": "Runtime Environment", "q": "A banking organization is working with IDMC on a runtime environment requirement. The organization has multiple Secure Agents assigned to different workload groups. A mapping task must run only on the agents approved for finance integrations. The team needs a supported way to select those runtime resources. The team wants a maintainable solution that uses the platform capabilities appropriately. They want to avoid unnecessary manual work and preserve the existing business intent. The architect is reviewing the design before implementation. Based on this scenario, which decision is most appropriate?", "o": ["Select a project folder as the runtime resource", "Assign the mapping task to the runtime environment containing the approved agents", "Store the agent names in an Expression transformation", "Use a connection object as the execution environment"], "a": 1, "e": "Runtime environments group Secure Agent resources for job execution.", "m": 2, "id": 118}, {"n": 119, "d": "Medium", "t": "Connection", "q": "A education organization is working with IDMC on a connection requirement. Several mappings must read the same cloud database. Developers currently repeat endpoint details in separate places, creating maintenance risk. The team wants centrally managed access settings that can be reused. The team wants a maintainable solution that uses the platform capabilities appropriately. They want to avoid unnecessary manual work and preserve the existing business intent. The architect is reviewing the design before implementation. Based on this scenario, which decision is most appropriate?", "o": ["Create and reuse a connection containing endpoint and authentication properties", "Hardcode endpoint details in every mapping expression for the stated requirement", "Store credentials in taskflow decision conditions within the integration workflow", "Create a separate mapplet for database authentication as the primary design approach"], "a": 0, "e": "Connections centralize the properties IDMC uses to access a source or target system.", "m": 2, "id": 119}, {"n": 120, "d": "Medium", "t": "Mapping vs Task", "q": "A healthcare organization is working with IDMC on a mapping vs task requirement. A mapping contains validated source-to-target logic used by several scheduled jobs. Each job needs different runtime parameters and schedules, but the transformation design should remain the same. The team wants clear separation of design and execution configuration. The team wants a maintainable solution that uses the platform capabilities appropriately. They want to avoid unnecessary manual work and preserve the existing business intent. The architect is reviewing the design before implementation. Based on this scenario, which decision is most appropriate?", "o": ["Copy the mapping for every schedule for the stated requirement", "Reuse the mapping and create mapping task configurations for the different executions", "Put all transformation logic only in the task object", "Use a connection object instead of a mapping task"], "a": 1, "e": "Mappings define data logic, while mapping tasks provide runnable configuration.", "m": 2, "id": 120}, {"n": 121, "d": "Medium", "t": "Pushdown Filter", "q": "A retail organization is working with IDMC on a pushdown filter requirement. A source contains hundreds of columns and years of history, but downstream reporting uses only recent rows and a subset of fields. The mapping currently reads far more data than necessary before filtering. The team wants to reduce data movement with minimal redesign. The team wants a maintainable solution that uses the platform capabilities appropriately. They want to avoid unnecessary manual work and preserve the existing business intent. The architect is reviewing the design before implementation. Based on this scenario, which decision is most appropriate?", "o": ["Read the full dataset and filter only before the target", "Apply compatible filtering/projection as close to the source database as possible through pushdown", "Increase Secure Agent memory and keep the same flow", "Disable database-side processing to simplify execution for the stated requirement"], "a": 1, "e": "Early database-side filtering reduces transferred data and can improve overall execution efficiency.", "m": 2, "id": 121}, {"n": 122, "d": "Medium", "t": "Sorter", "q": "A logistics organization is working with IDMC on a sorter requirement. A legacy export must be delivered in customer and shipment-date order. The target consumer depends on deterministic row ordering. No grouping or filtering requirement exists. The team wants a maintainable solution that uses the platform capabilities appropriately. They want to avoid unnecessary manual work and preserve the existing business intent. The architect is reviewing the design before implementation. Based on this scenario, which decision is most appropriate?", "o": ["Use an Aggregator transformation to impose order", "Use a Lookup transformation to control sequence", "Use a Router transformation to sort each category", "Use a Sorter transformation with the required sort keys"], "a": 3, "e": "Sorter is the component intended to order rows by configured keys.", "m": 2, "id": 122}, {"n": 123, "d": "Medium", "t": "Union", "q": "A insurance organization is working with IDMC on a union requirement. Two claim feeds have the same target structure and need to be processed as one stream. There is no business-key match requirement between the feeds. The team wants to append the rows before common downstream transformations. The team wants a maintainable solution that uses the platform capabilities appropriately. They want to avoid unnecessary manual work and preserve the existing business intent. The architect is reviewing the design before implementation. Based on this scenario, which decision is most appropriate?", "o": ["Use a Union transformation to combine the compatible row streams", "Use a Joiner transformation with a fabricated key", "Use a Lookup to append rows from the second feed", "Use a Rank transformation to merge the pipelines"], "a": 0, "e": "Union appends compatible row sets vertically without key-based matching.", "m": 2, "id": 123}, {"n": 124, "d": "Medium", "t": "Rank", "q": "A retail organization is working with IDMC on a rank requirement. A dashboard feed needs the top ten products by revenue in each region. Sorting alone would still pass every product downstream. The team needs only a limited set of highest-ranked rows. The team wants a maintainable solution that uses the platform capabilities appropriately. They want to avoid unnecessary manual work and preserve the existing business intent. The architect is reviewing the design before implementation. Based on this scenario, which decision is most appropriate?", "o": ["Use only a Sorter transformation and keep all rows", "Use a Router transformation with one output per product", "Use a Lookup transformation to determine row rank", "Use a Rank transformation configured for the required top records"], "a": 3, "e": "Rank selects top or bottom records based on configured ranking criteria.", "m": 2, "id": 124}, {"n": 125, "d": "Medium", "t": "Performance Tuning", "q": "A saas organization is working with IDMC on a performance tuning requirement. A mapping has gradually slowed as data volumes increased. The team sees heavy engine processing, repeated reference access, and more data movement than expected. They want evidence- based optimization rather than simply adding resources. The team wants a maintainable solution that uses the platform capabilities appropriately. They want to avoid unnecessary manual work and preserve the existing business intent. The architect is reviewing the design before implementation. Based on this scenario, which decision is most appropriate?", "o": ["Review logs and execution design, then optimize pushdown, lookup strategy, and unnecessary data movement", "Increase all compute sizes before reviewing execution behavior for the stated requirement", "Disable monitoring so runtime overhead is lower within the integration workflow", "Duplicate the mapping into smaller copies without analysis as the primary design approach"], "a": 0, "e": "Performance tuning should target the actual bottleneck using execution evidence and appropriate design changes.", "m": 2, "id": 125}, {"n": 126, "d": "Medium", "t": "Taskflow Command", "q": "A manufacturing organization is working with IDMC on a taskflow command requirement. A pipeline must run a supported system utility after data export completes. The action is outside the data mapping itself but belongs to the orchestration. The team wants the taskflow to control the operation and its status. The team wants a maintainable solution that uses the platform capabilities appropriately. They want to avoid unnecessary manual work and preserve the existing business intent. The architect is reviewing the design before implementation. Based on this scenario, which decision is most appropriate?", "o": ["Put the shell command inside an Aggregator transformation", "Use a Joiner transformation to invoke the utility", "Use a Lookup transformation as the command executor", "Use a taskflow command step for the system-level action"], "a": 3, "e": "Command steps are the appropriate orchestration mechanism for supported system-level commands.", "m": 2, "id": 126}, {"n": 127, "d": "Medium", "t": "Event-Driven Taskflow", "q": "A travel organization is working with IDMC on a event-driven taskflow requirement. A process should start when a defined application event arrives rather than on a fixed daily schedule. The event may arrive at unpredictable times. The team wants native event-driven orchestration. The team wants a maintainable solution that uses the platform capabilities appropriately. They want to avoid unnecessary manual work and preserve the existing business intent. The architect is reviewing the design before implementation. Based on this scenario, which decision is most appropriate?", "o": ["Use the relevant taskflow trigger or listener capability for the event", "Poll with a monthly batch schedule for the stated requirement", "Use a Sorter transformation to wait for the event", "Create a mapping task with no trigger and run it manually"], "a": 0, "e": "Triggers/listeners support event-driven taskflow execution.", "m": 2, "id": 127}, {"n": 128, "d": "Medium", "t": "Error Quarantine", "q": "A financial services organization is working with IDMC on a error quarantine requirement. A transaction pipeline contains some invalid records with missing mandatory fields. The business wants valid rows to continue while failed rows are retained for investigation. Stopping the whole pipeline is unacceptable. The team wants a maintainable solution that uses the platform capabilities appropriately. They want to avoid unnecessary manual work and preserve the existing business intent. The architect is reviewing the design before implementation. Based on this scenario, which decision is most appropriate?", "o": ["Load invalid rows into the production target without validation for the stated requirement", "Route invalid rows to a separate error or quarantine flow while valid rows continue", "Stop the entire pipeline on the first invalid record within the integration workflow", "Discard invalid rows without any trace as the primary design approach"], "a": 1, "e": "Separating invalid records preserves throughput while maintaining traceability for remediation.", "m": 2, "id": 128}, {"n": 129, "d": "Medium", "t": "CAI Parallelism", "q": "A healthcare organization is working with IDMC on a cai parallelism requirement. A CAI process calls several independent external services before a final consolidation step. The calls currently run one after another and dominate response time. Only the consolidation step depends on all results. The team wants a maintainable solution that uses the platform capabilities appropriately. They want to avoid unnecessary manual work and preserve the existing business intent. The architect is reviewing the design before implementation. Based on this scenario, which decision is most appropriate?", "o": ["Keep all service calls sequential regardless of dependency for the stated requirement", "Cache old responses instead of executing current calls within the integration workflow", "Run the independent service calls in parallel and join the flow before consolidation", "Remove the consolidation dependency entirely as the primary design approach"], "a": 2, "e": "Parallel execution is appropriate for independent steps and can reduce end- to-end latency while preserving the final dependency.", "m": 2, "id": 129}, {"n": 130, "d": "Medium", "t": "Expression Transformation", "q": "A healthcare organization is working with IDMC on a expression transformation requirement. A provider feed contains raw duration, quantity, and rate fields that must produce several derived business columns. The current mapping uses multiple duplicated calculations across downstream branches. The team wants one clear place for row-level derivation logic before later filtering and loading. The team wants a maintainable solution that uses the platform capabilities appropriately. They want to avoid unnecessary manual work and preserve the existing business intent. The architect is reviewing the design before implementation. Based on this scenario, which decision is most appropriate?", "o": ["Use an Expression transformation to calculate and standardize the derived fields", "Use an Aggregator transformation for every row-level formula", "Use a Router transformation to calculate numerical expressions", "Use a Union transformation to derive new columns"], "a": 0, "e": "Expression is designed for row-level calculations, conversions, and derived output fields without grouping records.", "m": 2, "id": 130}, {"n": 131, "d": "Hard", "t": "Pushdown Compatibility", "q": "A retail organization operates a production IDMC solution involving pushdown compatibility. A high-volume order pipeline uses filters, joins, expressions, and aggregations before loading Snowflake. Most operations still execute in the integration engine even though Snowflake has available compute. The profile shows heavy data movement and long engine-side processing. Some expressions use functions that are not compatible with database-side execution, and business logic cannot change materially. The architect wants maximum pushdown while preserving correctness and maintainability. The workload is business-critical and the team must avoid introducing a workaround that only hides the underlying design issue. Operational traceability, maintainability, and predictable recovery are required. The architect is comparing several alternatives and wants the design that best satisfies all stated conditions. Based on the scenario, which decision is most appropriate?", "o": ["Force full pushdown without checking function compatibility for the stated requirement", "Refactor only the incompatible expressions into pushdown-compatible logic so the eligible operations can execute in Snowflake", "Disable pushdown and scale the Secure Agent instead within the integration workflow", "Stage every transformation result in separate files before loading as the primary design approach"], "a": 1, "e": "Pushdown works best when transformation logic is compatible with the target database; refactoring incompatibilities can move more work to Snowflake without changing business intent.", "m": 2, "id": 131}, {"n": 132, "d": "Hard", "t": "CDC Recovery", "q": "A banking organization operates a production IDMC solution involving cdc recovery. A transaction feed uses incremental change processing into Snowflake. One run fails after some downstream work completes but before the watermark is safely advanced. Restarting from the wrong point could either duplicate changes or skip transactions. The source continues receiving new updates while recovery is performed. The team needs a restartable design with accurate incremental boundaries and traceability. The workload is business- critical and the team must avoid introducing a workaround that only hides the underlying design issue. Operational traceability, maintainability, and predictable recovery are required. The architect is comparing several alternatives and wants the design that best satisfies all stated conditions. Based on the scenario, which decision is most appropriate?", "o": ["Advance the checkpoint before processing begins for the stated requirement within the integration workflow", "Persist and advance the incremental checkpoint only after successful processing, then restart from the last committed checkpoint", "Use the current clock time as the restart point regardless of prior success", "Switch to full reloads after every failure without preserving incremental state as the primary design approach"], "a": 1, "e": "A committed checkpoint tied to successful processing prevents gaps and makes CDC restart behavior deterministic.", "m": 2, "id": 132}, {"n": 133, "d": "Hard", "t": "Parallel Dependency Control", "q": "A telecom organization operates a production IDMC solution involving parallel dependency control. A taskflow has eight regional mappings, two shared validation tasks, and one final consolidation. Regional mappings are independent, but consolidation requires every successful regional output. The current design is fully sequential and exceeds the batch window. Running everything in parallel would violate the final dependency and complicate failure handling. The architect wants shorter elapsed time without losing dependency control. The workload is business-critical and the team must avoid introducing a workaround that only hides the underlying design issue. Operational traceability, maintainability, and predictable recovery are required. The architect is comparing several alternatives and wants the design that best satisfies all stated conditions. Based on the scenario, which decision is most appropriate?", "o": ["Keep all tasks sequential to preserve simplicity for the stated requirement", "Run consolidation in parallel with regional mappings within the integration workflow", "Run independent regional mappings in parallel, then gate consolidation on completion of the required branches", "Remove validation dependencies and rely on target checks later as the primary design approach"], "a": 2, "e": "The correct design combines parallelism for independent work with explicit dependency control before the consolidation step.", "m": 2, "id": 133}, {"n": 134, "d": "Hard", "t": "Lookup Strategy", "q": "A e-commerce organization operates a production IDMC solution involving lookup strategy. A product lookup contains 200,000 rows and changes once per day. The fact stream contains tens of millions of rows and repeatedly requests the same product keys. Direct database lookups create excessive calls, but keeping stale data after the daily refresh is unacceptable. The team needs fast enrichment and predictable refresh behavior. The architect is choosing a lookup strategy for the daily batch. The workload is business-critical and the team must avoid introducing a workaround that only hides the underlying design issue. Operational traceability, maintainability, and predictable recovery are required. The architect is comparing several alternatives and wants the design that best satisfies all stated conditions. Based on the scenario, which decision is most appropriate?", "o": ["Use an uncached database lookup for every fact row for the stated requirement", "Use a persistent cache that is never refreshed within the integration workflow", "Replace the lookup with a Router transformation based on product keys as the primary design approach", "Use a lookup cache refreshed for each batch so repeated keys are resolved locally using current reference data"], "a": 3, "e": "A batch-scoped cache reduces repeated database access while still allowing the reference data to be refreshed each run.", "m": 2, "id": 134}, {"n": 135, "d": "Hard", "t": "Reusable Governance", "q": "A saas organization operates a production IDMC solution involving reusable governance. Dozens of mappings use shared validation logic owned by a central data-quality team. Business units also need limited flexibility for client-specific rules. Copying the shared rules has caused drift, while one giant shared component would make every change risky. The team wants governed reuse with clear ownership and extension points. The architect is reviewing modular design. The workload is business-critical and the team must avoid introducing a workaround that only hides the underlying design issue. Operational traceability, maintainability, and predictable recovery are required. The architect is comparing several alternatives and wants the design that best satisfies all stated conditions. Based on the scenario, which decision is most appropriate?", "o": ["Copy the entire validation flow into every client mapping for the stated requirement", "Move all client-specific rules into one global mapplet within the integration workflow", "Hardcode shared rules in mapping task properties as the primary design approach", "Place stable common rules in reusable mapplet logic and keep client-specific logic outside the shared component"], "a": 3, "e": "Separating stable shared logic from client-specific logic provides reuse without making the reusable component overly coupled.", "m": 2, "id": 135}, {"n": 136, "d": "Hard", "t": "Secure Agent Resilience", "q": "A manufacturing organization operates a production IDMC solution involving secure agent resilience. Two factories depend on on-premises data sources and run critical nightly integrations. A single Secure Agent currently handles all jobs, creating a runtime single point of failure. The business requires better runtime availability without exposing source systems publicly. Connections and mappings should not need redesign when an agent host fails. The platform team is reviewing runtime architecture. The workload is business-critical and the team must avoid introducing a workaround that only hides the underlying design issue. Operational traceability, maintainability, and predictable recovery are required. The architect is comparing several alternatives and wants the design that best satisfies all stated conditions. Based on the scenario, which decision is most appropriate?", "o": ["Use a runtime environment with multiple appropriately configured Secure Agents so jobs have resilient execution resources", "Expose the databases publicly and remove the agents for the stated requirement", "Create duplicate mappings tied to different hardcoded hosts within the integration workflow", "Use a taskflow decision step as a substitute for runtime redundancy"], "a": 0, "e": "Grouping multiple Secure Agents in the runtime environment improves execution resilience while preserving the same integration design.", "m": 2, "id": 136}, {"n": 137, "d": "Hard", "t": "Environment Promotion", "q": "A insurance organization operates a production IDMC solution involving environment promotion. The same integration solution moves from development to test and production. Connections, schemas, file locations, and credentials differ in each environment. Current promotions require manual edits to mappings, which has caused production mistakes. The team wants controlled promotion with minimal design changes and repeatable configuration. Security-sensitive values must not be hardcoded. The workload is business-critical and the team must avoid introducing a workaround that only hides the underlying design issue. Operational traceability, maintainability, and predictable recovery are required. The architect is comparing several alternatives and wants the design that best satisfies all stated conditions. Based on the scenario, which decision is most appropriate?", "o": ["Maintain separate independently edited mappings for each environment", "Hardcode production values before promoting the development asset", "Store all environment differences in transformation expressions for the stated requirement", "Parameterize environment-specific properties and supply approved runtime configuration during deployment or execution"], "a": 3, "e": "Parameterization separates environment configuration from mapping design and supports safer promotion.", "m": 2, "id": 137}, {"n": 138, "d": "Hard", "t": "CAI Fault Isolation", "q": "A fintech organization operates a production IDMC solution involving cai fault isolation. A CAI payment workflow calls identity, risk, notification, and ledger services. A notification outage should not roll back a successful ledger action, while identity or risk failure must stop the payment path. The current workflow treats every service failure identically. The business needs different recovery behavior based on service criticality. Monitoring must show which branch failed and what recovery occurred. The workload is business-critical and the team must avoid introducing a workaround that only hides the underlying design issue. Operational traceability, maintainability, and predictable recovery are required. The architect is comparing several alternatives and wants the design that best satisfies all stated conditions. Based on the scenario, which decision is most appropriate?", "o": ["Apply one ignore-error rule to every service call for the stated requirement within the integration workflow", "Stop the entire workflow for any noncritical notification failure as the primary design approach", "Define fault handling per service path, with stop/recovery for critical calls and isolated retry or alternate handling for noncritical calls", "Remove all fault handling and rely on manual support for this processing scenario in the current pipeline design"], "a": 2, "e": "Granular fault handling lets the process preserve critical correctness while isolating failures that should not invalidate completed work.", "m": 2, "id": 138}, {"n": 139, "d": "Hard", "t": "Hierarchical Flattening", "q": "A healthcare organization operates a production IDMC solution involving hierarchical flattening. A JSON claim document contains claim, member, provider, and repeating procedure arrays. Analysts need relational outputs while maintaining the association between each procedure and its parent claim. A naive flatten creates duplicate or orphaned relationships. The pipeline must remain scalable as nested arrays grow. The team wants a structured design rather than storing raw JSON only. The workload is business-critical and the team must avoid introducing a workaround that only hides the underlying design issue. Operational traceability, maintainability, and predictable recovery are required. The architect is comparing several alternatives and wants the design that best satisfies all stated conditions. Based on the scenario, which decision is most appropriate?", "o": ["Flatten the hierarchy with preserved parent identifiers so repeated child records remain linked to the correct parent", "Flatten all arrays without carrying parent identifiers for the stated requirement within the integration workflow", "Discard the repeating procedure arrays during transformation as the primary design approach", "Store each nested object independently without relationship keys for this processing scenario"], "a": 0, "e": "Hierarchical processing must preserve parent-child keys during flattening to maintain data integrity.", "m": 2, "id": 139}, {"n": 140, "d": "Hard", "t": "Monitoring and Root Cause", "q": "A telecom organization operates a production IDMC solution involving monitoring and root cause. A mapping shows unpredictable runtime spikes on some days. Source volume varies moderately, but spikes do not always correlate with row count. Execution logs show occasional slow lookups and periods of heavy engine processing. The team has been increasing compute reactively without proving the bottleneck. They need a repeatable diagnostic approach before tuning. The workload is business-critical and the team must avoid introducing a workaround that only hides the underlying design issue. Operational traceability, maintainability, and predictable recovery are required. The architect is comparing several alternatives and wants the design that best satisfies all stated conditions. Based on the scenario, which decision is most appropriate?", "o": ["Increase all compute resources permanently for the stated requirement within the integration workflow", "Disable monitoring to remove any logging overhead as the primary design approach", "Correlate monitoring logs, step-level execution behavior, lookup activity, and data volume before selecting a targeted optimization", "Rewrite every mapping transformation without analyzing evidence for this processing scenario"], "a": 2, "e": "Evidence-based tuning identifies the actual bottleneck and avoids expensive changes that may not address the problem.", "m": 2, "id": 140}, {"n": 141, "d": "Hard", "t": "Pushdown Join Design", "q": "A logistics organization operates a production IDMC solution involving pushdown join design. A join between shipments and routes is eligible for database execution except for a custom expression embedded in the join condition. Because of that expression, the join stays in the IDMC engine and moves large datasets. The same custom expression can be derived earlier using database-compatible functions. The team wants to preserve the business rule while enabling more pushdown. The architect is deciding where to place the derivation. The workload is business-critical and the team must avoid introducing a workaround that only hides the underlying design issue. Operational traceability, maintainability, and predictable recovery are required. The architect is comparing several alternatives and wants the design that best satisfies all stated conditions. Based on the scenario, which decision is most appropriate?", "o": ["Derive the compatible join key before the join and use a simple database-compatible join condition", "Keep the complex expression inside the join and force pushdown", "Move the join entirely to the mapping engine for the stated requirement", "Replace the join with a Router and Union combination within the integration workflow"], "a": 0, "e": "Simplifying the join predicate with pre-derived compatible keys improves pushdown eligibility without changing the matching rule.", "m": 2, "id": 141}, {"n": 142, "d": "Hard", "t": "Error Quarantine and Restart", "q": "A financial services organization operates a production IDMC solution involving error quarantine and restart. A daily load processes millions of records, with a small number failing validation. The pipeline currently stops on the first invalid row and must be rerun from the beginning. Valid data should not be delayed, but failed records must be traceable and reprocessable after correction. The team also wants reruns to avoid duplicating already accepted rows. The architect needs a resilient operating model. The workload is business- critical and the team must avoid introducing a workaround that only hides the underlying design issue. Operational traceability, maintainability, and predictable recovery are required. The architect is comparing several alternatives and wants the design that best satisfies all stated conditions. Based on the scenario, which decision is most appropriate?", "o": ["Stop the entire run for any invalid record for the stated requirement", "Discard rejected rows and rerun the complete source within the integration workflow", "Load invalid rows into production and flag them later as the primary design approach", "Route failed rows to a quarantine path, commit valid processing, and design controlled reprocessing of corrected rejects"], "a": 3, "e": "A quarantine/reprocessing pattern preserves throughput, traceability, and controlled recovery without repeating valid work.", "m": 2, "id": 142}, {"n": 143, "d": "Hard", "t": "CAI-CDI Transaction Boundary", "q": "A retail organization operates a production IDMC solution involving cai-cdi transaction boundary. An API request in CAI starts a CDI pipeline that writes business data. The API caller needs a meaningful completion status, but the data job may run longer than the initial request window. The current design blocks the API until the data pipeline finishes and causes timeouts. The business can accept asynchronous processing if status is trackable. The solution should remain orchestrated and observable. The workload is business-critical and the team must avoid introducing a workaround that only hides the underlying design issue. Operational traceability, maintainability, and predictable recovery are required. The architect is comparing several alternatives and wants the design that best satisfies all stated conditions. Based on the scenario, which decision is most appropriate?", "o": ["Use CAI to trigger the CDI work asynchronously and return a trackable process status rather than blocking for full completion", "Keep the synchronous API call open until every data step finishes for the stated requirement", "Remove CDI orchestration and require manual job starts within the integration workflow as the primary design approach", "Return success immediately without recording any downstream status for this processing scenario in the current pipeline design"], "a": 0, "e": "Asynchronous orchestration avoids request timeout while retaining traceable process execution.", "m": 2, "id": 143}, {"n": 144, "d": "Hard", "t": "Batch Window Optimization", "q": "A insurance organization operates a production IDMC solution involving batch window optimization. A nightly process contains ingestion, reference enrichment, several independent regional transforms, and one final aggregate. The batch misses its SLA by forty minutes. Profiling shows ingestion and enrichment are shared prerequisites, regional transforms are independent, and the aggregate requires all regional outputs. Simply scaling every component would increase cost without addressing the serial design. The team needs a structural optimization. The workload is business-critical and the team must avoid introducing a workaround that only hides the underlying design issue. Operational traceability, maintainability, and predictable recovery are required. The architect is comparing several alternatives and wants the design that best satisfies all stated conditions. Based on the scenario, which decision is most appropriate?", "o": ["Run the aggregate at the same time as regional transforms for the stated requirement", "Keep the entire workflow sequential and only increase compute within the integration workflow", "Keep shared prerequisites sequential, execute independent regional transforms in parallel, then run the final aggregate after all branches complete", "Duplicate ingestion in every regional branch as the primary design approach for this processing scenario"], "a": 2, "e": "This hybrid taskflow preserves dependencies while exploiting safe parallelism to reduce elapsed time.", "m": 2, "id": 144}, {"n": 145, "d": "Hard", "t": "Dynamic Runtime Values", "q": "A media organization operates a production IDMC solution involving dynamic runtime values. A reusable mapping loads different content tables depending on tenant and date. The current design constructs separate mappings for each tenant, and every new tenant requires code duplication. Table names and file paths vary, but transformation logic is stable. The business expects frequent onboarding of new tenants. The team wants controlled runtime flexibility. The workload is business-critical and the team must avoid introducing a workaround that only hides the underlying design issue. Operational traceability, maintainability, and predictable recovery are required. The architect is comparing several alternatives and wants the design that best satisfies all stated conditions. Based on the scenario, which decision is most appropriate?", "o": ["Clone the mapping for each tenant and hardcode values", "Use parameters for tenant-specific object names and paths while maintaining one transformation design", "Store tenant names in a Sorter transformation for the stated requirement", "Create a new Secure Agent for each tenant within the integration workflow"], "a": 1, "e": "Parameterization is intended for runtime variation of configuration values without duplicating core mapping logic.", "m": 2, "id": 145}, {"n": 146, "d": "Hard", "t": "Real-Time vs Batch Boundary", "q": "A payments organization operates a production IDMC solution involving real-time vs batch boundary. The platform receives high-volume authorization events continuously and reconciliation files every night. Authorization decisions need low latency, while reconciliation can run in a scheduled window. The team is considering one ingestion pattern for operational simplicity. Using the wrong pattern could either increase latency or operational overhead. The architect wants each workload aligned to its service-level requirement. The workload is business-critical and the team must avoid introducing a workaround that only hides the underlying design issue. Operational traceability, maintainability, and predictable recovery are required. The architect is comparing several alternatives and wants the design that best satisfies all stated conditions. Based on the scenario, which decision is most appropriate?", "o": ["Use real-time ingestion for authorization events and scheduled batch ingestion for reconciliation files", "Use batch for authorizations and real-time for nightly reconciliation", "Use real-time processing for every source regardless of latency needs", "Use manual ingestion for both workloads for the stated requirement"], "a": 0, "e": "The source supports distinct batch and real-time patterns; matching them to latency requirements gives the appropriate design.", "m": 2, "id": 146}, {"n": 147, "d": "Hard", "t": "Data Profiling Governance", "q": "A healthcare organization operates a production IDMC solution involving data profiling governance. Several source systems use the same field name but with different value conventions. Teams have been writing cleansing rules independently, producing inconsistent downstream interpretation. A new integration program wants standardized rules based on observed source behavior. The architects need objective evidence before defining common transformations. The solution should also make future source onboarding easier. The workload is business-critical and the team must avoid introducing a workaround that only hides the underlying design issue. Operational traceability, maintainability, and predictable recovery are required. The architect is comparing several alternatives and wants the design that best satisfies all stated conditions. Based on the scenario, which decision is most appropriate?", "o": ["Define one global rule without examining any source data for the stated requirement", "Skip profiling and rely only on field names within the integration workflow", "Create separate unrelated cleansing logic for every source as the primary design approach", "Profile representative sources first, document the observed patterns, and base shared validation rules on those findings"], "a": 3, "e": "Profiling supplies the evidence needed to standardize transformation rules across heterogeneous sources.", "m": 2, "id": 147}, {"n": 148, "d": "Hard", "t": "Connection Security", "q": "A banking organization operates a production IDMC solution involving connection security. Many mappings access the same protected database. Developers have started placing endpoint and login details in mapping notes and local files. The security team wants centralized, reusable connection configuration with controlled access. The integration logic should not contain raw credentials. Operational changes to the endpoint should require minimal mapping updates. The workload is business-critical and the team must avoid introducing a workaround that only hides the underlying design issue. Operational traceability, maintainability, and predictable recovery are required. The architect is comparing several alternatives and wants the design that best satisfies all stated conditions. Based on the scenario, which decision is most appropriate?", "o": ["Embed credentials directly in every mapping expression for the stated requirement", "Store the credentials in taskflow branch labels within the integration workflow", "Create duplicate mappings whenever the endpoint changes as the primary design approach", "Use centrally managed IDMC connection objects and reference them from mappings/tasks"], "a": 3, "e": "Connection objects centralize endpoint/authentication properties and reduce credential sprawl in integration logic.", "m": 2, "id": 148}, {"n": 149, "d": "Hard", "t": "Taskflow Conditional Recovery", "q": "A education organization operates a production IDMC solution involving taskflow conditional recovery. A student-load workflow validates files, loads good records, and sends status notifications. If validation finds only warnings, loading should continue with a warning notification. If validation finds critical errors, loading must stop and a remediation branch must run. The current flow has only pass/fail behavior. The team wants native orchestration without custom external scripts. The workload is business-critical and the team must avoid introducing a workaround that only hides the underlying design issue. Operational traceability, maintainability, and predictable recovery are required. The architect is comparing several alternatives and wants the design that best satisfies all stated conditions. Based on the scenario, which decision is most appropriate?", "o": ["Use a single sequential path for all outcomes", "Use decision logic with distinct branches for pass, warning, and critical outcomes", "Run every branch in parallel regardless of validation result", "Use a Joiner transformation to select the taskflow path"], "a": 1, "e": "Decision steps allow taskflows to branch based on runtime conditions and support multiple outcomes.", "m": 2, "id": 149}, {"n": 150, "d": "Hard", "t": "Reference Enrichment Scalability", "q": "A retail organization operates a production IDMC solution involving reference enrichment scalability. A product-reference dataset grows from thousands to millions of rows and is updated more frequently. The previous fully cached lookup now consumes excessive memory and refresh time. Most fact rows still need enrichment by product key. The team wants to reassess the lookup design rather than keep the old configuration blindly. Database-side processing is available. The workload is business-critical and the team must avoid introducing a workaround that only hides the underlying design issue. Operational traceability, maintainability, and predictable recovery are required. The architect is comparing several alternatives and wants the design that best satisfies all stated conditions. Based on the scenario, which decision is most appropriate?", "o": ["Keep the large lookup fully cached regardless of growth for the stated requirement", "Use an uncached row-by-row lookup without analysis within the integration workflow", "Replace the reference enrichment with a Rank transformation as the primary design approach", "Evaluate pushdown or database-side join/enrichment instead of assuming the existing full-cache lookup remains optimal"], "a": 3, "e": "As reference size and update frequency change, the previous cache strategy may no longer be optimal; database-side enrichment can reduce agent pressure and movement.", "m": 2, "id": 150}, {"n": 151, "d": "Hard", "t": "Reusable Component Versioning", "q": "A saas organization operates a production IDMC solution involving reusable component versioning. A reusable cleansing component is used by twenty mappings. A proposed change is valid for new clients but could alter historical behavior for existing ones. Updating the shared object in place would affect all consumers at once. The team needs controlled adoption and regression safety. Governance requires predictable change impact. The workload is business-critical and the team must avoid introducing a workaround that only hides the underlying design issue. Operational traceability, maintainability, and predictable recovery are required. The architect is comparing several alternatives and wants the design that best satisfies all stated conditions. Based on the scenario, which decision is most appropriate?", "o": ["Modify the shared component in place without testing consumers for the stated requirement", "Introduce a managed new version of the reusable logic and migrate consumers deliberately after validation", "Duplicate random copies inside each mapping within the integration workflow", "Remove reuse and hardcode all rules locally as the primary design approach"], "a": 1, "e": "Controlled versioning of reusable logic reduces unintended cross-mapping impact while retaining maintainability.", "m": 2, "id": 151}, {"n": 152, "d": "Hard", "t": "Orchestration Observability", "q": "A travel organization operates a production IDMC solution involving orchestration observability. A taskflow coordinates five tasks and two external calls. Users report occasional delays, but the final status alone does not show which step is responsible. The team needs actionable evidence for duration, failures, and branch behavior. They also want to distinguish slow external calls from slow data tasks. The design should use platform monitoring rather than custom spreadsheets. The workload is business-critical and the team must avoid introducing a workaround that only hides the underlying design issue. Operational traceability, maintainability, and predictable recovery are required. The architect is comparing several alternatives and wants the design that best satisfies all stated conditions. Based on the scenario, which decision is most appropriate?", "o": ["Only record the final success/failure status for the stated requirement", "Increase all task timeouts without measuring step durations within the integration workflow", "Disable logs to reduce noise as the primary design approach", "Use detailed taskflow/run monitoring and step-level logs to isolate delay and failure locations"], "a": 3, "e": "Step-level monitoring provides the observability needed to diagnose orchestration delays and failures.", "m": 2, "id": 152}, {"n": 153, "d": "Hard", "t": "CAI Connector Reuse", "q": "A fintech organization operates a production IDMC solution involving cai connector reuse. Several CAI processes call the same customer-verification API with the same authentication and endpoint. Each process currently implements the call differently, creating inconsistent error handling. The API team may change the endpoint in the future. The integration team wants reusable service access with centralized maintenance. The process-specific business logic should remain separate. The workload is business-critical and the team must avoid introducing a workaround that only hides the underlying design issue. Operational traceability, maintainability, and predictable recovery are required. The architect is comparing several alternatives and wants the design that best satisfies all stated conditions. Based on the scenario, which decision is most appropriate?", "o": ["Use a reusable service connector/configuration for the API and keep workflow-specific logic in each process", "Hardcode the endpoint separately in every process for the stated requirement", "Use CDI mapplets as the API communication mechanism within the integration workflow", "Copy the entire CAI process for each use case as the primary design approach"], "a": 0, "e": "Reusable connector configuration centralizes service access while allowing each process to retain its own orchestration logic.", "m": 2, "id": 153}, {"n": 154, "d": "Hard", "t": "Source Filtering vs Engine Filtering", "q": "A retail organization operates a production IDMC solution involving source filtering vs engine filtering. A source table holds five years of sales, but a daily pipeline only needs yesterday's rows. The current mapping extracts all years and applies a filter later in the engine. Network transfer and runtime continue to rise as history grows. The business rule is a simple date predicate supported by the source database. The team wants the smallest design change with the largest reduction in movement. The workload is business-critical and the team must avoid introducing a workaround that only hides the underlying design issue. Operational traceability, maintainability, and predictable recovery are required. The architect is comparing several alternatives and wants the design that best satisfies all stated conditions. Based on the scenario, which decision is most appropriate?", "o": ["Keep extracting all history and increase Secure Agent memory", "Filter only after all joins and aggregations complete for the stated requirement", "Push the date predicate to the source/database so only required rows are read", "Disable pushdown so execution behavior is uniform within the integration workflow"], "a": 2, "e": "Applying a supported predicate at the source reduces extracted volume and downstream processing.", "m": 2, "id": 154}, {"n": 155, "d": "Hard", "t": "Snowflake Concurrency Context", "q": "A analytics organization operates a production IDMC solution involving snowflake concurrency context. Multiple IDMC loads and dashboard queries share Snowflake during peak hours. The IDMC mappings themselves are efficient, but analytics queries queue heavily when concurrency spikes. Increasing warehouse size helps individual query speed but does not fully address simultaneous demand. The architecture needs a Snowflake-side concurrency decision without changing IDMC mappings. The source material uses multi- cluster warehouses for this pattern. The workload is business-critical and the team must avoid introducing a workaround that only hides the underlying design issue. Operational traceability, maintainability, and predictable recovery are required. The architect is comparing several alternatives and wants the design that best satisfies all stated conditions. Based on the scenario, which decision is most appropriate?", "o": ["Use result caching as the only concurrency strategy", "Force all workloads into one sequential schedule", "Use multi-cluster warehouse behavior for the concurrency-heavy Snowflake workload", "Disable warehouse scaling and increase IDMC engine processing"], "a": 2, "e": "Multi-cluster behavior addresses concurrent query demand, which is distinct from making an individual query faster.", "m": 2, "id": 155}, {"n": 156, "d": "Hard", "t": "Snowflake Idle Cost Context", "q": "A saas organization operates a production IDMC solution involving snowflake idle cost context. Several Snowflake warehouses support scheduled IDMC jobs but remain idle for long periods between runs. Compute cost continues during inactivity because automatic suspension is not configured. The team wants jobs to resume when needed without manual operations. No mapping redesign is required. The source material explicitly uses auto- suspend for this cost pattern. The workload is business-critical and the team must avoid introducing a workaround that only hides the underlying design issue. Operational traceability, maintainability, and predictable recovery are required. The architect is comparing several alternatives and wants the design that best satisfies all stated conditions. Based on the scenario, which decision is most appropriate?", "o": ["Configure automatic warehouse suspension during inactivity with resume behavior as needed", "Keep warehouses continuously running for faster startup for the stated requirement", "Change every mapping to use a different connection", "Use clustering keys to control compute billing within the integration workflow"], "a": 0, "e": "Auto-suspend is the source-supported mechanism for reducing idle warehouse compute cost.", "m": 2, "id": 156}, {"n": 157, "d": "Hard", "t": "Snowflake Query Cache Context", "q": "A media organization operates a production IDMC solution involving snowflake query cache context. A dashboard repeatedly runs identical Snowflake queries against data that changes only once per day. Some users see very fast rep
