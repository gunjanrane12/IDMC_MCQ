eated responses, while responses slow after the daily load changes underlying data. The team wants to understand the condition rather than force caching blindly. Warehouse size is unchanged. The source material distinguishes valid result reuse from changed-data behavior. The workload is business- critical and the team must avoid introducing a workaround that only hides the underlying design issue. Operational traceability, maintainability, and predictable recovery are required. The architect is comparing several alternatives and wants the design that best satisfies all stated conditions. Based on the scenario, which decision is most appropriate?", "o": ["Assume cached results remain valid after source data changes for the stated requirement", "Increase warehouse size to force reuse of old results within the integration workflow", "Rely on result-cache reuse only while the query is eligible and underlying data remains unchanged", "Use clustering to keep stale query results available as the primary design approach"], "a": 2, "e": "Result-cache reuse depends on cache eligibility and unchanged underlying data; changes invalidate the previous result.", "m": 2, "id": 157}, {"n": 158, "d": "Hard", "t": "Snowflake Pruning Context", "q": "A fintech organization operates a production IDMC solution involving snowflake pruning context. A very large Snowflake transaction table is frequently filtered by date and region. Queries are scanning more micro-partitions than expected after substantial data evolution. The IDMC pipeline is not the main bottleneck; the issue is data access efficiency in Snowflake. The team wants to improve pruning with minimal query changes. The source material discusses clustering and pruning for this pattern. The workload is business-critical and the team must avoid introducing a workaround that only hides the underlying design issue. Operational traceability, maintainability, and predictable recovery are required. The architect is comparing several alternatives and wants the design that best satisfies all stated conditions. Based on the scenario, which decision is most appropriate?", "o": ["Move all filtering back into the IDMC engine for the stated requirement", "Use a Router transformation to reorganize Snowflake storage within the integration workflow", "Use an appropriate clustering strategy on frequently filtered columns when the table benefits from it", "Increase taskflow parallelism to reduce partition scans as the primary design approach"], "a": 2, "e": "Clustering on appropriate filter columns can improve micro-partition pruning for large Snowflake tables.", "m": 2, "id": 158}, {"n": 159, "d": "Hard", "t": "Full Pipeline Recovery", "q": "A logistics organization operates a production IDMC solution involving full pipeline recovery. A multi-step workflow ingests files, transforms data, and loads Snowflake. An upstream ingestion task succeeds, a middle transform fails, and downstream tasks must not run. The input file should not be ingested twice during recovery, and operators need a clear restart point. The workflow currently has no explicit recovery design. The architect needs controlled fault handling and restartability. The workload is business-critical and the team must avoid introducing a workaround that only hides the underlying design issue. Operational traceability, maintainability, and predictable recovery are required. The architect is comparing several alternatives and wants the design that best satisfies all stated conditions. Based on the scenario, which decision is most appropriate?", "o": ["Rerun every step blindly from the beginning for the stated requirement", "Ignore the failed transform and continue downstream within the integration workflow", "Use taskflow fault handling plus idempotent/checkpointed steps so recovery resumes from a safe known point", "Delete all monitoring history before retrying as the primary design approach"], "a": 2, "e": "Fault handling combined with restart-safe task design prevents duplicate work and provides a clear recovery path.", "m": 2, "id": 159}, {"n": 160, "d": "Hard", "t": "Pushdown Tradeoff", "q": "A healthcare organization operates a production IDMC solution involving pushdown tradeoff. A mapping can push most logic to Snowflake, but one business rule depends on functionality unavailable for pushdown. Forcing database execution would change the rule, while keeping all logic in the engine creates unnecessary data movement. The team wants the best compromise. The design must preserve exact business semantics. The architect is choosing between all-or-nothing execution approaches. The workload is business-critical and the team must avoid introducing a workaround that only hides the underlying design issue. Operational traceability, maintainability, and predictable recovery are required. The architect is comparing several alternatives and wants the design that best satisfies all stated conditions. Based on the scenario, which decision is most appropriate?", "o": ["Change the business rule so full pushdown becomes possible for the stated requirement", "Disable all pushdown because one operation is incompatible within the integration workflow", "Push compatible operations to Snowflake and keep only the incompatible rule in the integration engine", "Force the incompatible operation to the database even if semantics change"], "a": 2, "e": "Selective/partial pushdown preserves correctness while still moving eligible work closer to the data.", "m": 2, "id": 160}];
let set=[],ans={},i=0;
(()=>{const c={};ALL.forEach(q=>c[q.t]=(c[q.t]||0)+1);
 Object.keys(c).sort().forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=`${t} (${c[t]})`;topic.appendChild(o)})})();
document.getElementById('info').textContent=ALL.length+' questions loaded · 100 Easy (1 mark) · 30 Medium (2 marks) · 30 Hard (2 marks) · 220 marks total';
function shuffle(a){for(let k=a.length-1;k>0;k--){const j=Math.random()*(k+1)|0;[a[k],a[j]]=[a[j],a[k]]}return a}
function prep(q){if(!shopt.checked)return q;const idx=shuffle([0,1,2,3]);return {...q,o:idx.map(k=>q.o[k]),a:idx.indexOf(q.a)}}
function start(pool){
 set=pool||ALL.filter(q=>(!diff.value||q.d===diff.value)&&(!topic.value||q.t===topic.value));
 if(!pool){if(ord.value==='rnd')shuffle(set=set.slice());const c=+cnt.value;if(c)set=set.slice(0,c);set=set.map(prep)}
 if(!set.length){alert('No questions match');return}
 ans={};i=0;setup.classList.add('hide');res.classList.add('hide');quiz.classList.remove('hide');render()}
function back(){res.classList.add('hide');quiz.classList.add('hide');setup.classList.remove('hide')}
function stats(){let c=0,t=0;set.forEach((q,k)=>{if(k in ans){t++;if(ans[k]===q.a)c++}});return[c,t]}
function render(){
 const q=set[i];pos.textContent=`Question ${i+1} of ${set.length}`;
 qn.textContent='Q'+q.id+' · '+q.t+' · '+q.m+(q.m>1?' marks':' mark');df.textContent=q.d;qt.textContent=q.q;
 opts.innerHTML='';
 q.o.forEach((o,k)=>{const b=document.createElement('button');b.className='opt';
  b.innerHTML=`<b>${'ABCD'[k]}.</b><span></span>`;b.lastChild.textContent=o;b.onclick=()=>pick(k);opts.appendChild(b)});
 if(i in ans)reveal();else exp.style.display='none';
 prev.disabled=i===0;next.disabled=i===set.length-1;
 const[c,t]=stats();sc.textContent=`Score: ${c}/${t}`;pb.style.width=(t/set.length*100)+'%';
 grid.innerHTML='';set.forEach((x,k)=>{const b=document.createElement('button');b.textContent=k+1;
  b.className=(k in ans?(ans[k]===x.a?'c':'w'):'')+(k===i?' cur':'');b.onclick=()=>{i=k;render()};grid.appendChild(b)})}
function pick(k){if(i in ans)return;ans[i]=k;render()}
function reveal(){const q=set[i];[...opts.children].forEach((b,k)=>{b.disabled=true;
 if(k===q.a)b.classList.add('ok');else if(k===ans[i])b.classList.add('no')});
 exp.style.display='block';exp.innerHTML='<b>'+(ans[i]===q.a?'✅ Correct. ':'❌ Incorrect. ')+'</b>Answer: '+'ABCD'[q.a]+'. ';
 exp.appendChild(document.createTextNode(q.e||''))}
function go(d){i=Math.max(0,Math.min(set.length-1,i+d));render()}
function finish(){const[c,t]=stats();quiz.classList.add('hide');res.classList.remove('hide');
 final.textContent=`${c} / ${set.length}`;fsub.textContent=`${t} attempted · ${set.length-t} skipped · ${(c/set.length*100).toFixed(0)}% · ${set.reduce((a,q,k)=>a+(ans[k]===q.a?q.m:0),0)}/${set.reduce((a,q)=>a+q.m,0)} marks`}
function retryWrong(){const w=set.filter((q,k)=>ans[k]!==q.a);if(!w.length){alert('Nothing to retry 🎉');return}start(w)}
document.addEventListener('keydown',e=>{if(quiz.classList.contains('hide'))return;
 if('abcd'.includes(e.key.toLowerCase())&&e.key.length===1)pick('abcd'.indexOf(e.key.toLowerCase()));
 if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)});
